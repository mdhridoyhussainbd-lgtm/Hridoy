<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found | Hridoy Hussain</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap">
<style>
  :root { --paper: #FFFFFF; --ink: #0E0E0E; --grey: #6B6B6B; color-scheme: light; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem 1rem; background: var(--paper); color: var(--ink); font-family: Montserrat, "Segoe UI", Arial, sans-serif; }
  .dot { width: 64px; height: 64px; border-radius: 50%; background: var(--ink); margin: 0 auto 2rem; }
  h1 { font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 900; letter-spacing: -.04em; }
  p { margin: 1rem 0 2rem; color: var(--grey); }
  a { display: inline-block; padding: 1rem 1.6rem; border-radius: 999px; background: var(--ink); color: var(--paper); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
  <main>
    <div class="dot" aria-hidden="true"></div>
    <h1>Lost the thread.</h1>
    <p>This page doesn't exist. It may have moved.</p>
    <a href="./">Back to the portfolio</a>
  </main>
</body>
</html>
